<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123e62"><title>Ma journée | French Flashcards</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#163047;background:#f2f6fb}*{box-sizing:border-box}body{margin:0}header{background:#123e62;color:white;padding:22px 16px;text-align:center}h1{margin:0;font-size:clamp(1.8rem,5vw,2.6rem)}header p{margin:7px 0 0;color:#dbeaf7}.wrap{max-width:790px;margin:25px auto;padding:0 16px}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;margin-bottom:15px}select,button{font:inherit;border-radius:10px;padding:11px 14px;border:1px solid #b6c8d8;background:white;color:#15334c;cursor:pointer}button:focus-visible,select:focus-visible,.flash:focus-visible{outline:3px solid #e49b22;outline-offset:3px}button.primary{background:#155d8d;color:white;border-color:#155d8d}button:hover{filter:brightness(.96)}.stats{text-align:center;margin:12px 0;color:#486075}.flash{display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:white;border:2px solid #b8d0e4;border-radius:22px;min-height:290px;padding:25px 22px;box-shadow:0 8px 26px #1c4c7018;cursor:pointer;user-select:none}.flash small{color:#5d7181;letter-spacing:.09em;text-transform:uppercase}.word{font-weight:750;font-size:clamp(2rem,7vw,3.1rem);margin:22px 0;overflow-wrap:anywhere}.hint{color:#61778a;font-size:.92rem}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:18px 0}.actions button{min-width:115px}.miss{border-color:#ba5b42;color:#a23e26}.know{border-color:#258368;color:#176b53}.progress{height:10px;border-radius:12px;background:#dbe5ef;overflow:hidden}.bar{height:100%;background:#258368;width:0;transition:width .2s}.foot{text-align:center;color:#5b6f80;font-size:.88rem;margin:25px 0}#done{display:none;text-align:center;padding:30px 10px}#done h2{margin:0 0 8px}@media(max-width:460px){.actions button{flex:1;min-width:130px}.flash{min-height:260px}}</style></head><body><header><h1>Ma journée</h1><p>Grade 8 Core French · Vocabulary Flashcards</p></header><main class="wrap"><div class="controls"><label for="category">Study:</label><select id="category" aria-label="Vocabulary category"><option value="all">All vocabulary</option></select><button id="shuffle">⇄ Shuffle</button><button id="reverse">French → English</button><button id="reset">Reset progress</button></div><div class="stats" id="stats" aria-live="polite"></div><div class="progress" aria-label="Progress"><div class="bar" id="bar"></div></div><div id="study"><div class="flash" id="flash" role="button" tabindex="0" aria-label="Flip flashcard"><small id="side">French</small><div class="word" id="word"></div><span class="hint" id="hint">Tap or press Enter to reveal translation</span></div><div class="actions"><button id="prev">← Previous</button><button id="flip" class="primary">Flip card</button><button id="next">Next →</button></div><div class="actions"><button id="again" class="miss">✕ Practise again</button><button id="known" class="know">✓ I know it</button></div></div><div id="done"><h2>Great work!</h2><p>You've reviewed every card in this selection.</p><button id="missed" class="primary">Review words to practise</button><button id="restart">Study all again</button></div><p class="foot">No account needed · Progress stays on this device until you reset it · No student data is collected</p></main><script>
const cards=[{"category": "Noms masculins", "front": "le déjeuner", "back": "breakfast"}, {"category": "Noms masculins", "front": "le dîner", "back": "lunch"}, {"category": "Noms masculins", "front": "le souper", "back": "supper"}, {"category": "Noms masculins", "front": "un repas", "back": "a meal"}, {"category": "Noms masculins", "front": "un ami", "back": "a friend"}, {"category": "Noms masculins", "front": "un copain", "back": "a buddy / companion"}, {"category": "Noms masculins", "front": "le dentiste", "back": "the dentist"}, {"category": "Noms masculins", "front": "le concierge", "back": "the janitor"}, {"category": "Noms masculins", "front": "un jeu", "back": "a game"}, {"category": "Noms masculins", "front": "midi", "back": "noon / midday"}, {"category": "Noms masculins", "front": "le jus", "back": "juice"}, {"category": "Noms masculins", "front": "jeudi", "back": "Thursday"}, {"category": "Noms masculins", "front": "un lit", "back": "a bed"}, {"category": "Noms masculins", "front": "le soir", "back": "the evening"}, {"category": "Noms masculins", "front": "le directeur", "back": "the principal"}, {"category": "Noms masculins", "front": "un sandwich", "back": "a sandwich"}, {"category": "Noms masculins", "front": "un dictionnaire", "back": "a dictionary"}, {"category": "Noms masculins", "front": "le cinéma", "back": "the movie theatre"}, {"category": "Noms masculins", "front": "un ordinateur", "back": "a computer"}, {"category": "Noms masculins", "front": "un crayon", "back": "a pencil"}, {"category": "Noms masculins", "front": "un sac à dos", "back": "a backpack"}, {"category": "Noms masculins", "front": "un cours", "back": "a class"}, {"category": "Noms masculins", "front": "le réveil", "back": "the alarm clock"}, {"category": "Noms masculins", "front": "un enseignant", "back": "a teacher"}, {"category": "Noms féminins", "front": "une journée", "back": "a day"}, {"category": "Noms féminins", "front": "la cloche", "back": "the bell"}, {"category": "Noms féminins", "front": "la récréation", "back": "recess"}, {"category": "Noms féminins", "front": "la secrétaire", "back": "the secretary"}, {"category": "Noms féminins", "front": "la directrice", "back": "the principal"}, {"category": "Noms féminins", "front": "une amie", "back": "a friend"}, {"category": "Noms féminins", "front": "une copine", "back": "a buddy / companion"}, {"category": "Noms féminins", "front": "la pizza", "back": "pizza"}, {"category": "Noms féminins", "front": "la bibliothécaire", "back": "the librarian"}, {"category": "Noms féminins", "front": "une casquette", "back": "a baseball cap"}, {"category": "Noms féminins", "front": "la salle de bains", "back": "the bathroom"}, {"category": "Noms féminins", "front": "la cour", "back": "the playground"}, {"category": "Noms féminins", "front": "l’entrée", "back": "the entrance"}, {"category": "Noms féminins", "front": "la télévision", "back": "the TV"}, {"category": "Noms féminins", "front": "la salle de classe", "back": "the classroom"}, {"category": "Noms féminins", "front": "une enseignante", "back": "a teacher"}, {"category": "Noms féminins", "front": "une mitaine", "back": "a mitten"}, {"category": "Noms féminins", "front": "une école", "back": "a school"}, {"category": "Noms féminins", "front": "une maison", "back": "a house"}, {"category": "Verbes", "front": "dormir", "back": "to sleep"}, {"category": "Verbes", "front": "se coucher", "back": "to go to bed / lie down"}, {"category": "Verbes", "front": "se réveiller", "back": "to wake up"}, {"category": "Verbes", "front": "se lever", "back": "to get up"}, {"category": "Verbes", "front": "se brosser les dents", "back": "to brush your teeth"}, {"category": "Verbes", "front": "manger", "back": "to eat"}, {"category": "Verbes", "front": "partir", "back": "to leave"}, {"category": "Verbes", "front": "jouer", "back": "to play"}, {"category": "Verbes", "front": "sonner", "back": "to ring"}, {"category": "Verbes", "front": "rire", "back": "to laugh"}, {"category": "Verbes", "front": "rêver", "back": "to dream"}, {"category": "Verbes", "front": "lire", "back": "to read"}, {"category": "Verbes", "front": "écrire", "back": "to write"}, {"category": "Verbes", "front": "travailler", "back": "to work"}, {"category": "Verbes", "front": "s’habiller", "back": "to get dressed"}, {"category": "Verbes", "front": "enfiler", "back": "to put on"}, {"category": "Verbes", "front": "quitter", "back": "to leave"}, {"category": "Verbes", "front": "saluer", "back": "to greet"}, {"category": "Verbes", "front": "mettre", "back": "to put"}, {"category": "Verbes", "front": "faire", "back": "to do / to make"}, {"category": "Expressions", "front": "Salut !", "back": "Hi! / Bye!"}, {"category": "Expressions", "front": "Il fait beau.", "back": "It’s beautiful out."}, {"category": "Expressions", "front": "Il fait chaud.", "back": "It’s hot."}, {"category": "Expressions", "front": "Il fait froid.", "back": "It’s cold."}, {"category": "Expressions", "front": "Il neige.", "back": "It’s snowing."}, {"category": "Expressions", "front": "Il pleut.", "back": "It’s raining."}];
const $=id=>document.getElementById(id);const categories=[...new Set(cards.map(c=>c.category))];categories.forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;$('category').append(o)});
let pool=[],idx=0,flipped=false,reversed=false,ratings={},missedMode=false;
const key='ma-journee-ratings-v1';try{ratings=JSON.parse(localStorage.getItem(key))||{}}catch(e){}
function save(){try{localStorage.setItem(key,JSON.stringify(ratings))}catch(e){}}
function build(){missedMode=false;pool=cards.map((c,i)=>({...c,id:i})).filter(c=>$('category').value==='all'||c.category===$('category').value);idx=0;flipped=false;render()}
function render(){let count=pool.length,known=pool.filter(c=>ratings[c.id]==='known').length,missed=pool.filter(c=>ratings[c.id]==='again').length;$('stats').textContent=count?`Card ${Math.min(idx+1,count)} of ${count} · ${known} known · ${missed} to practise`:'No cards in this selection';$('bar').style.width=count?(known/count*100)+'%':'0%';let finished=idx>=count||!count;$('study').style.display=finished?'none':'block';$('done').style.display=finished?'block':'none';if(finished)return;let c=pool[idx],front=reversed?c.back:c.front,back=reversed?c.front:c.back;$('side').textContent=flipped?(reversed?'French':'English'):(reversed?'English':'French');$('word').textContent=flipped?back:front;$('hint').textContent=flipped?'Tap to see the front again':'Tap or press Enter to reveal translation';$('reverse').textContent=reversed?'English → French':'French → English';$('prev').disabled=idx===0;$('next').disabled=idx>=count-1}
function flip(){flipped=!flipped;render()}function move(n){idx=Math.max(0,Math.min(pool.length-1,idx+n));flipped=false;render()}function rate(value){if(idx>=pool.length)return;ratings[pool[idx].id]=value;save();idx++;flipped=false;render()}
$('flash').onclick=flip;$('flash').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};$('flip').onclick=flip;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('known').onclick=()=>rate('known');$('again').onclick=()=>rate('again');$('category').onchange=build;$('reverse').onclick=()=>{reversed=!reversed;flipped=false;render()};$('shuffle').onclick=()=>{for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}idx=0;flipped=false;render()};$('reset').onclick=()=>{if(confirm('Clear your saved progress?')){ratings={};save();build()}};$('missed').onclick=()=>{pool=cards.map((c,i)=>({...c,id:i})).filter(c=>ratings[c.id]==='again'&&($('category').value==='all'||c.category===$('category').value));idx=0;flipped=false;if(!pool.length){alert('No words marked for extra practice!');build()}else render()};$('restart').onclick=build;build();
</script></body></html>
